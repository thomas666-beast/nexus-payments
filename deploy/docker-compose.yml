services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexus

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexus

  migrate:
    image: migrate/migrate:v4.17.0
    container_name: nexus-migrate
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://nexus:nexus_dev_password@postgres:5432/nexus?sslmode=disable
    command: ["up"]
    networks:
      - nexus

  nexus-payments:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nexus-payments
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bank-a:
        condition: service_started
      bank-b:
        condition: service_started
    environment:
      NEXUS_DSN: postgres://nexus:nexus_dev_password@postgres:5432/nexus?sslmode=disable
      NEXUS_GRPC_ADDR: ":9090"
      NEXUS_HTTP_ADDR: ":8080"
      NEXUS_METRICS_ADDR: ":9100"
      NEXUS_BANKS: "bank-a=bank-a:7071,bank-b=bank-b:7071"
    ports:
      - "8080:8080"
      - "9090:9090"
      - "9100:9100"
    networks:
      - nexus

  # ---------- virtual bank A ----------
  bank-a-db:
    image: postgres:16-alpine
    container_name: bank-a-db
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank_a
    ports:
      - "5543:5432"
    volumes:
      - bank_a_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank_a"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexus

  bank-a-migrate:
    image: migrate/migrate:v4.17.0
    container_name: bank-a-migrate
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      bank-a-db:
        condition: service_healthy
    volumes:
      - ../migrations-bank:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://bank:bank@bank-a-db:5432/bank_a?sslmode=disable
    command: ["up"]
    networks:
      - nexus

  bank-a:
    build:
      context: ..
      dockerfile: Dockerfile.virtualbank
    container_name: bank-a
    depends_on:
      bank-a-migrate:
        condition: service_completed_successfully
    environment:
      BANK_ID: bank-a
      BANK_DB_DSN: postgres://bank:bank@bank-a-db:5432/bank_a?sslmode=disable
      BANK_GRPC_ADDR: ":7071"
      FAIL_RESERVE_AFTER: "0"
      LATENCY_MS: "0"
    ports:
      - "7071:7071"
    networks:
      - nexus

  # ---------- virtual bank B ----------
  bank-b-db:
    image: postgres:16-alpine
    container_name: bank-b-db
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank_b
    ports:
      - "5544:5432"
    volumes:
      - bank_b_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank_b"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexus

  bank-b-migrate:
    image: migrate/migrate:v4.17.0
    container_name: bank-b-migrate
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      bank-b-db:
        condition: service_healthy
    volumes:
      - ../migrations-bank:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://bank:bank@bank-b-db:5432/bank_b?sslmode=disable
    command: ["up"]
    networks:
      - nexus

  bank-b:
    build:
      context: ..
      dockerfile: Dockerfile.virtualbank
    container_name: bank-b
    depends_on:
      bank-b-migrate:
        condition: service_completed_successfully
    environment:
      BANK_ID: bank-b
      BANK_DB_DSN: postgres://bank:bank@bank-b-db:5432/bank_b?sslmode=disable
      BANK_GRPC_ADDR: ":7071"
      FAIL_RESERVE_AFTER: "0"
      LATENCY_MS: "0"
    ports:
      - "7072:7071"
    networks:
      - nexus

volumes:
  postgres_data:
  redis_data:
  bank_a_data:
  bank_b_data:

networks:
  nexus:
    driver: bridge
