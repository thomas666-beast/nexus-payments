name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download deps
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Unit tests
        run: go test ./internal/... ./cmd/... -race -count=1 -coverprofile=coverage.out

      - name: Start services
        run: docker compose -f deploy/docker-compose.yml up -d postgres redis migrate

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            docker compose -f deploy/docker-compose.yml exec -T postgres pg_isready -U nexus -d nexus && break
            sleep 2
          done

      - name: Integration tests
        run: go test ./internal/store/... -race -count=1 -tags=integration

      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.57

      - name: Teardown
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download deps
        run: go mod download

      - name: Build and start full stack
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build

      - name: Wait for banks
        run: |
          for i in $(seq 1 60); do
            if docker compose -f deploy/docker-compose.yml exec -T bank-a-db pg_isready -U bank -d bank_a 2>/dev/null \
               && docker compose -f deploy/docker-compose.yml exec -T bank-b-db pg_isready -U bank -d bank_b 2>/dev/null; then
              echo "banks ready"
              break
            fi
            sleep 2
          done

      - name: Wait for nexus
        run: |
          for i in $(seq 1 60); do
            if docker compose -f deploy/docker-compose.yml exec -T nexus-payments ls /nexus 2>/dev/null; then
              sleep 3
              echo "nexus container up"
              break
            fi
            sleep 2
          done
          sleep 5

      - name: Install grpcurl
        run: |
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify reflection on nexus
        run: |
          grpcurl -plaintext localhost:9090 list
          grpcurl -plaintext localhost:7071 list
          grpcurl -plaintext localhost:7072 list

      - name: E2E tests
        run: go test -tags=e2e ./test/e2e/... -v -timeout 5m

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "===== nexus-payments ====="
          docker compose -f deploy/docker-compose.yml logs nexus-payments | tail -100
          echo "===== bank-a ====="
          docker compose -f deploy/docker-compose.yml logs bank-a | tail -50
          echo "===== bank-b ====="
          docker compose -f deploy/docker-compose.yml logs bank-b | tail -50

      - name: Teardown
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
